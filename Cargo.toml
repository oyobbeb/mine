[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/oyobbeb/mine"

[workspace.dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.9", features = ["derive"] }
futures = "0.3.34"
libc = "0.2.191"
portable-pty = "0.9.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "underline-color"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = "1.54.1"
toml = { version = "1.2.2", default-features = false, features = ["parse", "preserve_order", "serde", "std"] }
